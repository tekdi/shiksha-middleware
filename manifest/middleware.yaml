apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: middleware
  name: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: middleware
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: middleware
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - image: ${ECR_REPOSITORY}:${IMAGE_TAG}
        imagePullPolicy: "Always"
        name: middleware-pratham
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: middleware-service-config
        # Liveness probe - checks if container is alive
        livenessProbe:
          httpGet:
            path: /health/live
            port: 4000
          initialDelaySeconds: 30  # Wait 30s after container starts
          periodSeconds: 10         # Check every 10s
          timeoutSeconds: 5         # 5s timeout
          failureThreshold: 3       # Restart after 3 failures
        # Readiness probe - checks if service is ready (DB connected)
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 4000
          initialDelaySeconds: 10   # Wait 10s after container starts
          periodSeconds: 5          # Check every 5s
          timeoutSeconds: 5          # 5s timeout
          failureThreshold: 3       # Mark not ready after 3 failures
        # Startup probe - gives more time for initial startup
        startupProbe:
          httpGet:
            path: /health/ready
            port: 4000
          initialDelaySeconds: 0    # Start immediately
          periodSeconds: 5           # Check every 5s
          timeoutSeconds: 5         # 5s timeout
          failureThreshold: 12      # Allow up to 60s for startup (12 * 5s)
        resources:
          requests:
            cpu: "1000m"
            memory: "1500Mi"
          limits:
            cpu: "1500m"
            memory: "2Gi"

      restartPolicy: Always
status: {}

---
apiVersion: v1
kind: Service
metadata:
  name: middleware
spec:
  type: ClusterIP
  ports:
  - port: 4000
    protocol: TCP
  selector:
    app: middleware
